# Project detekt overrides, merged on top of the default config
# (build.gradle.kts sets buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    # @Composable functions are PascalCase by convention; don't flag them.
    ignoreAnnotated: ['Composable']

  MatchingDeclarationName:
    # Color.kt / Theme.kt / Type.kt / Shape.kt are the Android Studio Compose
    # template filenames, and the file names are what a Compose developer
    # looks for first — the alternative (FastpayColors.kt, FastpayTheme.kt)
    # would be less discoverable, not more. The rule's real target is a
    # misleading name like Foo.kt containing class Bar, which is not the case
    # here: the primary declaration is named after the concept the file holds.
    # Same carve-out as MagicNumber below, for the same reason — ui/theme is
    # the token package, and its layout is conventional.
    excludes: ['**/ui/theme/**']

style:
  WildcardImport:
    # Compose's layout/material3/runtime/animation packages are DSL surfaces —
    # a screen legitimately pulls dozens of symbols from each, and the
    # ecosystem (including Google's own samples) imports them wholesale.
    # Everything else must be imported explicitly.
    excludeImports:
      - 'androidx.compose.foundation.*'
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.runtime.*'
      - 'androidx.compose.animation.core.*'
      - 'androidx.compose.material.icons.filled.*'

  MagicNumber:
    # Compose UI is full of literal dp/sp/color/alpha values; flagging them as
    # "magic numbers" is noise. Design tokens are handled in the Phase 3 pass.
    ignoreAnnotated: ['Composable']
    # ui/theme is where the literal color/typography tokens are DEFINED — the
    # one place raw hex belongs.
    excludes: ['**/ui/theme/**']
